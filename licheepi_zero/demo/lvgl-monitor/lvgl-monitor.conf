# /etc/conf.d/lvgl-monitor —— 传给 /usr/local/bin/lvgl-monitor 的参数
#
# 这个文件是仓库里的唯一来源：
#   scripts/05-rootfs.sh       构建镜像时装进 rootfs
#   demo/run-on-board.sh --push 推板子时同步到 /etc/conf.d/lvgl-monitor
#
# 常用值（改完 rc-service lvgl-monitor restart 生效）：
#   LVGL_MONITOR_ARGS="--detail"    详细页（多一行网络/频率曲线，启动时按屏幕可切）
#   LVGL_MONITOR_ARGS="--fbdev"     退回 /dev/fb0 后端（默认走 DRM/KMS）
# 留空 = 默认监控页。
LVGL_MONITOR_ARGS=""
