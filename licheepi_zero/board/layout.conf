# LicheePi Zero Dock (Allwinner V3s) + 32 MiB SPI NOR (Macronix MX25L25645G)
#
# 分区单一数据源：设备树分区表、U-Boot 配置、烧录脚本都从这里取值。
#
#   offset      size         MTD#  label     内容
#   0x000000    0x100000     0     u-boot    SPL@0x0 + u-boot@0x8000 + 环境@0xF0000
#   0x100000    0x700000     1     kernel    Linux zImage（裸镜像）
#   0x800000    0x010000     2     dtb       sun8i-v3s-licheepi-zero-dock.dtb
#   0x810000    0x17F0000    3     rootfs    UBI 卷 "rootfs"（UBIFS 可读写根）
#   ------------------------------------------------------------------------
#   total       0x2000000    32 MiB
#
# kernel/dtb 必须在低 16 MiB：BROM 与 SPL 只会用 3 字节地址读引导区。
# 偏移/大小都是 64 KiB 擦除块的整数倍（06-manifest.sh 检查）。

FLASH_TOTAL=0x2000000

UBOOT_OFF=0x000000
UBOOT_SIZE=0x100000
UBOOT_MAX_IMAGE=0xF0000          # 0x100000 - ENV_SIZE，超过会盖到环境变量

ENV_OFF=0x0F0000                 # 在 u-boot 分区尾部，不单独分区
ENV_SIZE=0x10000
ENV_SECT_SIZE=0x1000

KERNEL_OFF=0x100000
KERNEL_SIZE=0x700000

DTB_OFF=0x800000
DTB_SIZE=0x010000

ROOTFS_OFF=0x810000
ROOTFS_SIZE=0x17F0000

# ---- UBI / UBIFS（NOR：PEB=64 KiB，min_io=1，subpage=1）----
# 与内核 drivers/mtd/ubi/build.c 的算法一致：
#   vid_hdr_offset = ALIGN(64, min_io) = 64；leb_size = PEB - 128
UBI_PEB_SIZE=0x10000
UBI_MIN_IO=1
UBI_SUB_PAGE=1
UBI_VID_HDR_OFF=64
UBI_LEB_SIZE=65408               # 0x10000 - 128
UBI_VOL_NAME=rootfs
# 卷在镜像里就建成满大小，不依赖内核 autoresize（avail_pebs=0 时它是空操作）：
#   分区 PEB 数 - UBI_LAYOUT_PEBS - UBI_VOL_LEBS_RESERVED
UBI_LAYOUT_PEBS=2
UBI_VOL_LEBS_RESERVED=2

# ---- MTD 序号（按 DTS fixed-partitions 顺序）----
MTD_UBOOT_INDEX=0
MTD_KERNEL_INDEX=1
MTD_DTB_INDEX=2
MTD_ROOTFS_INDEX=3

# ---- 内核加载地址（V3s 64 MiB DDR2，基址 0x40000000）----
KERNEL_LOAD_ADDR=0x41000000
DTB_LOAD_ADDR=0x41800000
